name: Comment Vercel Preview URL on PR

on:
  deployment_status:

permissions:
  pull-requests: write   # needed to post / delete PR comments
  issues: write          # listComments + deleteComment use the issues API

jobs:
  comment:
    if: |
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    steps:
      - name: Find related PR
        id: find-pr
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const sha = context.payload.deployment.sha;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const pr = prs.find(p => p.head.sha === sha);
            return pr ? String(pr.number) : '';

      - name: Post preview URL comment
        if: steps.find-pr.outputs.result != ''
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ steps.find-pr.outputs.result }}');
            const url = context.payload.deployment_status.target_url;
            const env = context.payload.deployment.environment;

            // Delete previous bot comments for this PR
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            for (const c of comments) {
              if (c.user.login === 'github-actions[bot]' && c.body.includes('Preview URL')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `### 🚀 Preview URL\n\n${url}\n\n> Environment: ${env} · Deployed at ${new Date().toUTCString()}`,
            });
