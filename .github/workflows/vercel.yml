name: Deploy Frontend to Vercel

on:
  push:
    branches: [main]
    paths:
      - "beatstream/web/**"
      - ".github/workflows/vercel.yml"
  pull_request:
    branches: [main]
    paths:
      - "beatstream/web/**"
      - ".github/workflows/vercel.yml"

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  PROJECT_NAME: beatstream

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beatstream/web

    steps:
      - name: Validate VERCEL_TOKEN
        if: env.VERCEL_TOKEN == ''
        run: |
          echo "::error::VERCEL_TOKEN secret is not set. Add it in Settings → Secrets and Variables → Actions."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: beatstream/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Resolve Vercel org and project IDs
        id: vercel-ids
        run: |
          # Fetch current user to get org ID
          ORG_ID=$(curl -sf \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v2/user" | jq -r '.user.id')

          # List projects and find by name
          PROJECT_ID=$(curl -sf \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects?limit=100" \
            | jq -r --arg name "$PROJECT_NAME" '.projects[] | select(.name == $name) | .id')

          if [ -z "$PROJECT_ID" ]; then
            echo "Project '$PROJECT_NAME' not found — creating it..."
            PROJECT_ID=$(curl -sf -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$PROJECT_NAME\",\"framework\":\"nextjs\"}" \
              "https://api.vercel.com/v9/projects" | jq -r '.id')
            echo "Created project: $PROJECT_ID"
          fi

          echo "ORG_ID=$ORG_ID" >> "$GITHUB_OUTPUT"
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Disable deployment protection (allow unauthenticated preview)
        run: |
          curl -sf -X PATCH \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"ssoProtection":null}' \
            "https://api.vercel.com/v9/projects/${{ steps.vercel-ids.outputs.PROJECT_ID }}" > /dev/null

      - name: Pull Vercel environment
        run: |
          vercel pull --yes --environment=production \
            --token "$VERCEL_TOKEN" \
            --scope "${{ steps.vercel-ids.outputs.ORG_ID }}"
        env:
          VERCEL_ORG_ID: ${{ steps.vercel-ids.outputs.ORG_ID }}
          VERCEL_PROJECT_ID: ${{ steps.vercel-ids.outputs.PROJECT_ID }}

      - name: Build project
        run: |
          vercel build --prod \
            --token "$VERCEL_TOKEN"
        env:
          VERCEL_ORG_ID: ${{ steps.vercel-ids.outputs.ORG_ID }}
          VERCEL_PROJECT_ID: ${{ steps.vercel-ids.outputs.PROJECT_ID }}

      - name: Deploy to Vercel (production)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: deploy-prod
        run: |
          URL=$(vercel deploy --prebuilt --prod \
            --token "$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $URL"
        env:
          VERCEL_ORG_ID: ${{ steps.vercel-ids.outputs.ORG_ID }}
          VERCEL_PROJECT_ID: ${{ steps.vercel-ids.outputs.PROJECT_ID }}

      - name: Deploy preview (pull request)
        if: github.event_name == 'pull_request'
        id: deploy-preview
        run: |
          URL=$(vercel deploy --prebuilt \
            --token "$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $URL"
        env:
          VERCEL_ORG_ID: ${{ steps.vercel-ids.outputs.ORG_ID }}
          VERCEL_PROJECT_ID: ${{ steps.vercel-ids.outputs.PROJECT_ID }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy-preview.outputs.url }}';
            const body = `### Vercel Preview Deployment\n\n| Status | URL |\n|--------|-----|\n| ✅ Ready | [${url}](${url}) |`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
