services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"  # HTTPS — mkcert cert (run: make certs)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro  # TLS certs (gitignored keys)
    depends_on:
      - api-1
      - api-2
      - api-3
    restart: unless-stopped

  api-1:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgres://user:pass@postgres:5432/beatstream?sslmode=disable
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PRESIGN_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: beatstream-audio
      KAFKA_BROKERS: redpanda:9092
      PORT: "8080"
      METRICS_PORT: "9090"
      LOG_FORMAT: "json"
      LOG_LEVEL: "info"
      JWT_SECRET: "dev-secret-change-in-production"
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001,https://localhost"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
      OTEL_SERVICE_NAME: "beatstream-api"
      APP_ENV: "development"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  api-2:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgres://user:pass@postgres:5432/beatstream?sslmode=disable
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PRESIGN_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: beatstream-audio
      KAFKA_BROKERS: redpanda:9092
      PORT: "8080"
      METRICS_PORT: "9090"
      LOG_FORMAT: "json"
      LOG_LEVEL: "info"
      JWT_SECRET: "dev-secret-change-in-production"
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001,https://localhost"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  api-3:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgres://user:pass@postgres:5432/beatstream?sslmode=disable
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PRESIGN_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: beatstream-audio
      KAFKA_BROKERS: redpanda:9092
      PORT: "8080"
      METRICS_PORT: "9090"
      LOG_FORMAT: "json"
      LOG_LEVEL: "info"
      JWT_SECRET: "dev-secret-change-in-production"
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001,https://localhost"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgres://user:pass@postgres:5432/beatstream?sslmode=disable
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: beatstream
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d beatstream"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

  # ── Jaeger — distributed tracing UI (OTel third pillar) ─────────────────────
  # Traces: http://localhost:16686
  # OTLP ingest (HTTP): http://localhost:4318
  # Correlate with logs via trace_id field in zap JSON output
  # AWS equivalent: AWS X-Ray (use ADOT sidecar collector in ECS)
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "4318:4318"    # OTLP HTTP ingest
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  grafanadata:
