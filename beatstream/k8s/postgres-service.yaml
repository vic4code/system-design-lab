apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: beatstream
spec:
  # Headless service (clusterIP: None) gives each StatefulSet pod a stable DNS name:
  #   postgres-0.postgres.beatstream.svc.cluster.local
  # Required by StatefulSet — the serviceName field must reference this Service.
  # Our app connects to "postgres:5432" which resolves to the headless service DNS,
  # which for a single-pod StatefulSet resolves to postgres-0's IP.
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
