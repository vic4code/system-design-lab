apiVersion: v1
kind: Secret
metadata:
  name: beatstream-secrets
  namespace: beatstream
type: Opaque
# stringData lets you write plaintext — Kubernetes base64-encodes it on apply.
# In production: use Sealed Secrets, Vault, or SOPS, never commit plaintext secrets.
stringData:
  DATABASE_URL: "postgres://user:pass@postgres:5432/beatstream?sslmode=disable"
  REDIS_URL: "redis://redis:6379"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin"
  # Used by the postgres StatefulSet container itself
  POSTGRES_USER: "user"
  POSTGRES_PASSWORD: "pass"
  POSTGRES_DB: "beatstream"
