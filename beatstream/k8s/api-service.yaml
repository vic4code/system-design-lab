apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: beatstream
  labels:
    app: api
spec:
  # ClusterIP (default): stable virtual IP, reachable only inside the cluster.
  # kube-proxy load-balances across all healthy pods (round-robin by default).
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: metrics
      port: 9090
      targetPort: 9090
