# nginx.conf — Beatstream reverse proxy
#
# Local dev:   HTTP (80) redirects to HTTPS (443) with mkcert self-signed cert
# Production:  ACM certificate terminates TLS at the ALB;
#              nginx inside ECS handles plain HTTP from ALB (private subnet only)
#
# Security headers are set at BOTH nginx and Go middleware layers.
# Defence-in-depth: if one layer is misconfigured the other still applies.

events {
    worker_connections 1024;
}

http {
    client_max_body_size 50m;

    # ── Upstream ──────────────────────────────────────────────────────────────
    upstream beatstream_api {
        least_conn;
        server api-1:8080 weight=1 max_fails=3 fail_timeout=30s;
        server api-2:8080 weight=1 max_fails=3 fail_timeout=30s;
        server api-3:8080 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Hide nginx version (don't advertise attack surface)
    server_tokens off;

    # Structured JSON access log — ready for CloudWatch Logs Insights queries
    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent",'
        '"request_id":"$request_id"}';

    access_log /var/log/nginx/access.log json_combined;

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host:443$request_uri;
    }

    # ── HTTPS (local dev with mkcert cert) ────────────────────────────────────
    server {
        listen 443 ssl;
        server_name localhost;

        # Local: mkcert cert.  Production: cert managed by ACM at ALB layer.
        ssl_certificate     /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        # PCI-DSS requires TLS 1.2+. Disable TLS 1.0/1.1.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:CHACHA20;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;  # Disable for forward secrecy

        # Security headers (nginx layer — defence in depth alongside Go middleware)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options            DENY                                  always;
        add_header X-Content-Type-Options     nosniff                               always;
        add_header Referrer-Policy            strict-origin-when-cross-origin       always;

        # Health check (bypasses upstream, no logging)
        location /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # All API traffic
        location /v1/ {
            proxy_pass         http://beatstream_api;
            proxy_http_version 1.1;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID      $request_id;

            # Strip server info from upstream responses
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
        }

        # Health and readiness probes
        location ~ ^/(healthz|ready)$ {
            proxy_pass http://beatstream_api;
        }

        # nginx metrics — restrict to internal network only
        location /nginx_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;   # VPC CIDR in production
            deny all;
        }
    }
}
